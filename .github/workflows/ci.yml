name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: banglaclaw
          POSTGRES_PASSWORD: banglaclaw
          POSTGRES_DB: banglaclaw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U banglaclaw -d banglaclaw_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports: ["6333:6333"]
    env:
      TEST_DATABASE_URL: postgres://banglaclaw:banglaclaw@localhost:5432/banglaclaw_test
      TEST_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Pack and install the npm packages
        run: pnpm verify:pack
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high
