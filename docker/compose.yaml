# Local PostgreSQL for BanglaClaw development.
#   docker compose -f docker/compose.yaml up -d
#   export DATABASE_URL=postgres://banglaclaw:banglaclaw@localhost:54329/banglaclaw
name: banglaclaw

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: banglaclaw
      POSTGRES_PASSWORD: banglaclaw
      POSTGRES_DB: banglaclaw
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banglaclaw -d banglaclaw"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
