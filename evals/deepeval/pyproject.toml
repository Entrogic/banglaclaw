[project]
name = "banglaclaw-evals"
version = "0.1.0"
description = "DeepEval harness for BanglaClaw agents: runs goldens through the gateway and records scores at /v1/admin/evals"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "deepeval>=4.3,<5",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["banglaclaw_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
