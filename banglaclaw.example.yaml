# Copy to banglaclaw.yaml (or run `banglaclaw init`). API keys and DATABASE_URL come from environment variables only.
agent:
  name: banglaclaw

models:
  default:
    provider: openai-compatible   # or: anthropic
    model: gpt-4o-mini
    # baseUrl: http://localhost:11434/v1

runtime:
  maxIterations: 6
  maxToolCalls: 8
  timeoutMs: 60000

tools:
  allow:
    - calculator
    - current_datetime

storage:
  provider: memory        # or: postgres (needs DATABASE_URL, then `banglaclaw db migrate`)
  checkpoints: true

memory:
  maxHistoryMessages: 20

skills:
  dirs: [skills]
  maxActive: 2

timezone: Asia/Dhaka
