# Copy to banglaclaw.yaml (or run `banglaclaw init`). API keys and DATABASE_URL come from environment variables only.
agent:
  name: banglaclaw

models:
  default:
    provider: openai-compatible   # or: anthropic
    model: gpt-4o-mini
    # baseUrl: http://localhost:11434/v1

runtime:
  maxIterations: 6
  maxToolCalls: 8
  timeoutMs: 60000

tools:
  allow:
    - calculator
    - current_datetime
    - search_knowledge
    - remember
    - recall
    - forget
    - bangladesh__*        # every tool of the "bangladesh" MCP server below

storage:
  provider: memory        # or: postgres (needs DATABASE_URL, then `banglaclaw db migrate`)
  checkpoints: true

memory:
  maxHistoryMessages: 20
  longTerm:
    enabled: false               # remember/recall/forget tools, scoped per user/chat
    autoRecall: true             # add relevant memories to the prompt each run
    recallLimit: 5
    maxPerOwner: 200

embeddings:
  model: text-embedding-3-small  # uses OPENAI_API_KEY (or EMBEDDINGS_API_KEY)
  # baseUrl: http://localhost:11434/v1   # e.g. Ollama with model: bge-m3

voice:                           # voice notes on Telegram, WhatsApp and Messenger
  enabled: false                 # transcribe, then answer like text (uses OPENAI_API_KEY or TRANSCRIPTION_API_KEY)
  model: whisper-1               # or gpt-4o-mini-transcribe
  # baseUrl: http://localhost:8000/v1   # any OpenAI-compatible /audio/transcriptions server
  language: bn                   # recogniser hint; "auto" to detect
  maxSeconds: 120                # longer voice notes are refused before download

knowledge:
  enabled: false                 # search_knowledge tool (RAG over your documents)
  vectorStore: memory            # memory (rebuilt on start) | qdrant (persistent)
  vectorStoreUrl: http://localhost:56333   # Qdrant from docker/compose.yaml
  sources: []                    # files/dirs ingested on start, e.g. [docs/faq, policies.pdf]
  chunkSize: 1200
  chunkOverlap: 150
  searchLimit: 5

gateway:
  host: 127.0.0.1            # use 0.0.0.0 only behind a reverse proxy / firewall
  port: 3000
  corsOrigins: []            # e.g. [https://app.example.com]
  maxInputChars: 8000
  # dashboardDir: apps/dashboard/dist   # built admin dashboard served at /admin (admin API key)
  rateLimit:
    requestsPerMinute: 60    # per API key
    maxConcurrentRuns: 2     # per API key

skills:
  dirs: [skills]
  maxActive: 2

agents:
  dirs: [agents]                 # <dir>/<name>/AGENT.md specialists; none = single agent (see examples/agents)
  maxTransfers: 3

handoff:
  enabled: false                 # request_human tool; operators answer via "banglaclaw handoff" or /v1/handoffs

channels:
  web:
    enabled: true                # browser chat at http://<gateway>/chat
  widget:
    enabled: false               # chat bubble for your website: <script src="https://<gateway>/widget.js" async></script>
    allowedOrigins: []           # sites that may embed it, e.g. [https://shop.example.com]; needs BANGLACLAW_WIDGET_SECRET
    title: BanglaClaw
    # greeting: আসসালামু আলাইকুম! কীভাবে সাহায্য করতে পারি?
    # color: "#0b6b4f"
  telegram:
    enabled: false               # needs TELEGRAM_BOT_TOKEN (from @BotFather)
    mode: polling                # polling (no public URL) | webhook (needs webhookUrl + TELEGRAM_WEBHOOK_SECRET)
    # webhookUrl: https://bot.example.com
    access: allowlist            # allowlist | open — every message costs model tokens
    allowedUserIds: []           # your numeric Telegram user id(s)
    rateLimitPerMinute: 10       # per chat
  whatsapp:
    enabled: false               # needs WHATSAPP_ACCESS_TOKEN, WHATSAPP_APP_SECRET, WHATSAPP_VERIFY_TOKEN
    # phoneNumberId: "123456789012345"
    access: allowlist
    allowedNumbers: []           # e.g. ["8801712345678"]
    rateLimitPerMinute: 10
  messenger:
    enabled: false               # needs MESSENGER_PAGE_ACCESS_TOKEN, MESSENGER_APP_SECRET, MESSENGER_VERIFY_TOKEN
    # pageId: "104512345678901"  # your Facebook page id
    access: allowlist            # open for a public shop page (every message costs model tokens)
    allowedUserIds: []           # page-scoped user ids (PSIDs) from the gateway log
    rateLimitPerMinute: 10
    humanAgentTag: false         # operator replies up to 7 days (needs Meta's human_agent permission)

plugins: []                      # e.g. [examples/plugins/bd-phone] — trusted code only (docs/23)

# USD per 1M tokens by provider id (as shown in /v1/admin/stats), for cost estimates.
pricing: {}
# pricing:
#   "openai-compatible:gpt-4o-mini": { input: 0.15, output: 0.6 }

mcp:
  servers:
    # Bundled Bangladesh reference-data server (paths are relative to this file).
    bangladesh:
      transport: stdio
      command: node
      args: [--import, tsx, mcp-servers/bangladesh/src/bin.ts]   # or [mcp-servers/bangladesh/dist/bin.js] after `pnpm build`
      timeoutMs: 30000
    # remote:
    #   transport: http
    #   url: https://mcp.example.com/mcp
    #   headers: { Authorization: "Bearer ${REMOTE_MCP_TOKEN}" }  # ${VAR} is read from the environment

timezone: Asia/Dhaka
